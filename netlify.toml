[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/tabs/custom"
  to = "/player"
  status = 301
  force = false

[[redirects]]
  from = "/custom"
  to = "/player"
  status = 301
  force = false

[[redirects]]
  from = "/tabs/*"
  to = "/tab?id=:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(), camera=(), geolocation=(), screen-wake-lock=(self)"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
